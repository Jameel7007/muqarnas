<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>muqarnas — the render stage</title>
    <style>
      html,
      body {
        height: 100%;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #panel {
        position: fixed;
        top: 1.2rem;
        left: 1.2rem;
        max-width: 380px;
        background: rgba(20, 18, 14, 0.82);
        border: 1px solid #2c2820;
        padding: 1rem 1.2rem;
        backdrop-filter: blur(4px);
        z-index: 2;
      }
      #panel h1 {
        margin-bottom: 0.3rem;
      }
      #panel .sub {
        margin-bottom: 0.9rem;
      }
      #panel .picker {
        margin-bottom: 0.7rem;
      }
      #panel .views {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.7rem;
      }
      #status {
        display: block;
      }
      #panel a {
        color: #b7a97f;
        font-size: 0.75rem;
      }
    </style>
    <script type="module" crossorigin src="/muqarnas/assets/render-DexQeods.js"></script>
    <link rel="modulepreload" crossorigin href="/muqarnas/assets/solver-BibGwqpk.js">
    <link rel="modulepreload" crossorigin href="/muqarnas/assets/stage-C_fXMsOF.js">
    <link rel="stylesheet" crossorigin href="/muqarnas/assets/solver-Dp4mz5J1.css">
  </head>
  <body>
    <div id="stage"></div>
    <div id="panel">
      <h1>Muqarnas</h1>
      <p class="sub">the render stage — light is the subject</p>
      <div class="picker" id="readings"></div>
      <div class="views">
        <button class="pick" data-view="beneath">from beneath</button>
        <button class="pick" data-view="profile">profile</button>
      </div>
      <div class="picker" id="lights"></div>
      <label style="display: block; margin-bottom: 0.7rem; font-size: 0.7rem; color: #9a917d; font-family: ui-monospace, monospace">
        the raking light — scene 8's only motion
        <input id="azimuth" type="range" min="0" max="360" step="1" value="35" style="width: 100%; accent-color: #b7a97f" />
      </label>
      <span class="status ok" id="status">starting…</span>
      <p style="margin-top: 0.8rem"><a href="/">← plan inspection</a></p>
    </div>
  </body>
</html>
